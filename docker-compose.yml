services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable-debian
    volumes:
      - clamav_data:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3310 && echo PING >&3 && read -r -t 5 reply <&3 && [ \"$$reply\" = PONG ]"]
      interval: 10s
      timeout: 8s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18
    command: ["server"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
    expose:
      - "8200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:1.18
    entrypoint: ["/bin/sh", "/vault/init/init.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      CLAIM_TOKEN_SECRET: ${CLAIM_TOKEN_SECRET:-}
    volumes:
      - ./vault/init.sh:/vault/init/init.sh:ro
      - ./vault/backend-policy.hcl:/vault/init/backend-policy.hcl:ro
      - vault_keys:/vault/keys
      - vault_approle:/vault/approle
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/vault-ready"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      SCAN_PROVIDER: ${SCAN_PROVIDER:-real}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      SCANNER_HTTP_TIMEOUT_MS: ${SCANNER_HTTP_TIMEOUT_MS:-30000}
      SCANNER_REFRESH_COOLDOWN_MS: ${SCANNER_REFRESH_COOLDOWN_MS:-60000}
      SCAN_BACKGROUND_POLL_MS: ${SCAN_BACKGROUND_POLL_MS:-30000}
      SCAN_BACKGROUND_POLL_BATCH: ${SCAN_BACKGROUND_POLL_BATCH:-3}
      SCAN_MAX_RUNNING_MS: ${SCAN_MAX_RUNNING_MS:-3600000}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
      VIRUSTOTAL_BASE_URL: ${VIRUSTOTAL_BASE_URL:-https://www.virustotal.com/api/v3}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-10}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/vault/role_id
      VAULT_SECRET_ID_FILE: /run/vault/secret_id
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443,http://localhost:5173,http://127.0.0.1:5173}
      HTTP_RATE_LIMIT_PER_MINUTE: ${HTTP_RATE_LIMIT_PER_MINUTE:-300}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - vault_approle:/run/vault:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      vault-init:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    entrypoint: ["/bin/sh", "/run/go-virus/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      BACKEND: http://frontend:5173
      SERVER_NAME: ${WAF_SERVER_NAME:-localhost}
      PORT: 8080
      SSL_PORT: 8443
      SSL_PROTOCOLS: "TLSv1.2 TLSv1.3"
      SSL_CERT_FILE: /etc/nginx/conf/server.crt
      SSL_CERT_KEY_FILE: /etc/nginx/conf/server.key
      SSL_OCSP_STAPLING: "off"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
      MAX_FILE_SIZE: "26214400"
      COMBINED_FILE_SIZES: "26214400"
      MODSEC_REQ_BODY_LIMIT: "30000000"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "1048576"
    ports:
      - "${APP_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./waf/security-headers.conf.template:/etc/nginx/templates/conf.d/security-headers.conf.template:ro
      - ./waf/entrypoint.sh:/run/go-virus/entrypoint.sh:ro
      - ./waf/tls:/run/go-virus-tls:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/healthz"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  clamav_data:
  vault_data:
  vault_keys:
  vault_approle:
